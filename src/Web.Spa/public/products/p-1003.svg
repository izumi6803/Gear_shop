<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Mechanical keyboard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <pattern id="keys" width="26" height="24" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="20" height="18" rx="4" fill="#cbd5e1"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <ellipse cx="200" cy="238" rx="118" ry="14" fill="#cbd5e1" opacity="0.6"/>
  <rect x="70" y="112" width="260" height="100" rx="14" fill="#1e293b"/>
  <rect x="82" y="124" width="236" height="76" rx="8" fill="url(#keys)"/>
  <rect x="140" y="204" width="120" height="6" rx="3" fill="#334155"/>
</svg>
